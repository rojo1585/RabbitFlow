# Builds, tests (unit + integration with Testcontainers) and packs on every push/PR to main.
# Publishing to nuget.org is done on demand by publish.yml (version tag or manual run).

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore src/RedRabbit.slnx

    - name: Build
      run: dotnet build src/RedRabbit.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test src/RedRabbit.slnx --no-build --configuration Release --verbosity normal

    - name: Pack
      run: dotnet pack src/RedRabbit.csproj --no-build --configuration Release --output artifacts

    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: nuget-package
        path: |
          artifacts/*.nupkg
          artifacts/*.snupkg